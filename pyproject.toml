[project]
name = "rebalancer"
version = "1.0.0"
description = "Rebalancování klientských portfolií – rozhodovací podpora (Lukas Sysel)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
rebalancer = "rebalancer.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rebalancer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
